[build-system]
requires = ["setuptools==69.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "feat"
# Version is single-sourced from feat/__init__.py (__version__); bump it with
# `python scripts/bump_version.py {major|minor|patch}`. See docs/adr/0004.
dynamic = ["version"]
description = "Fundamental Equity Analysis Tool - CFA-grade equity analysis from the terminal, powered by Financial Modeling Prep"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "requests==2.32.3",
    "tabulate==0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "responses==0.25.3",
    "pytest-cov==5.0.0",
    "ruff==0.15.8",
    "mypy==1.19.1",
    "types-requests",
    "types-tabulate",
]

[project.scripts]
feat = "feat.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "feat.__version__" }

[tool.setuptools.packages.find]
include = ["feat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff's default lint set (pyflakes + core pycodestyle: unused imports,
# undefined names, real syntax/logic errors) — a low-noise gate that fits the
# project's existing style. Broaden the rule set in a follow-up if desired.

[tool.mypy]
python_version = "3.11"
files = ["feat"]
warn_unused_ignores = true
warn_redundant_casts = true

# `requests` ships type stubs via `types-requests` (a dev dependency), but the
# stub package is not always discoverable in every environment; ignore the
# missing-import there rather than fail the type gate on a third-party lib.
[[tool.mypy.overrides]]
module = ["requests.*", "tabulate"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["feat"]
branch = true

[tool.coverage.report]
show_missing = true
